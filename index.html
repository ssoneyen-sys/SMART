<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>수원 미세먼지 로보카 제어</title>
  <style>
    body { font-family: sans-serif; background: #f4f7f6; padding: 20px; }
    .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    button { padding: 15px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
    .connect-btn { background: #34495e; color: white; }
    .dust-btn { background: #27ae60; color: white; }
    input { width: 100%; padding: 15px; border: 1px solid #ddd; border-radius: 8px; margin-top: 10px; box-sizing: border-box; }
    .result { margin-top: 20px; font-size: 1.2em; font-weight: bold; text-align: center; }
  </style>
</head>
<body>

<div class="container">
  <h2>수원 미세먼지 로보카</h2>
  
  <input type="password" id="serviceKey" placeholder="에어코리아 인증키 입력">
  <input type="text" id="stationName" placeholder="동 이름 (예: 영통동)">
  
  <button class="connect-btn" onclick="connectSerial()">1. 로보카(아두이노) 연결</button>
  <button class="dust-btn" onclick="loadDust()">2. 미세먼지 조회 및 로보카 동작</button>

  <div class="result" id="status">연결 후 조회해주세요.</div>
</div>

<script>
  let serialWriter;

  // 1. 아두이노 연결
  async function connectSerial() {
    try {
      const port = await navigator.serial.requestPort();
      await port.open({ baudRate: 115200 });
      const writer = port.writable.getWriter();
      serialWriter = writer;
      alert("연결 성공!");
    } catch (e) { alert("연결 실패: " + e); }
  }

  // 2. 미세먼지 데이터 조회 및 로보카 명령 전송
  async function loadDust() {
    const key = document.getElementById("serviceKey").value;
    const station = document.getElementById("stationName").value;
    const url = `https://apis.data.go.kr/B552584/ArpltnInforInqireSvc/getMsrstnAcctoRltmMesureDnsty?serviceKey=${key}&returnType=json&numOfRows=1&stationName=${station}&dataTerm=DAILY&ver=1.3`;
  
    try {
      const res = await fetch(url);
      const data = await res.json();
      const pm10 = parseInt(data.response.body.items[0].pm10Value);
      
      let cmd = "NORMAL";
      if (pm10 <= 30) cmd = "GOOD";
      else if (pm10 <= 80) cmd = "NORMAL";
      else if (pm10 <= 150) cmd = "BAD";
      else cmd = "VERY_BAD";

      document.getElementById("status").innerText = `현재 PM10: ${pm10} (등급: ${cmd})`;
      
      // 아두이노로 명령어 전송
      if (serialWriter) {
        const encoder = new TextEncoder();
        await serialWriter.write(encoder.encode(cmd + "\n"));
      }
    } catch (e) { alert("조회 실패: " + e); }
  }
</script>

</body>
</html>
